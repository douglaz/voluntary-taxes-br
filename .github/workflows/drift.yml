name: drift

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      servico:
        description: "Código do serviço no PagTesouro (999999 força uma falha)"
        default: "018235"
        required: false

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      SERVICO: ${{ inputs.servico || '018235' }}
    steps:
      - uses: actions/checkout@v4
      - name: PagTesouro drift check
        run: scripts/drift.sh "$SERVICO"
      - name: Heartbeat
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: curl -fsS --retry 3 "$HC_PING_URL"
